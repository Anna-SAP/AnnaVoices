[pytest]
testpaths = tests
pythonpath = .
# basetemp stays in the repo: a shared %TEMP%\pytest-of-<user> left by an elevated
# process is unreadable afterwards and would fail every tmp_path test
addopts = -ra --strict-markers --strict-config --basetemp=.pytest_tmp
xfail_strict = true
markers =
    allow_subprocess: the test may start real child processes (blocked by default)
