name: Tests

# Deliberately no `paths:` filter. This check is required on main, and a required
# check that never starts leaves docs-only pull requests waiting forever.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest pending run per branch or pull request is needed.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      # Light set only: no demucs/torch, and tests/conftest.py blocks model downloads.
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run tests
        run: python -m pytest
